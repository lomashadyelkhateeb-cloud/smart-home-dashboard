<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Home Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Page Title -->
    <div class="wireframe-title">
        SMART HOME DASHBOARD - WIREFRAME
    </div>


    <!-- Main Dashboard -->
    <div class="dashboard">

        <!-- Header -->
        <header>
            <h1>SMART HOME</h1>

            <div class="overview">
                <span>Home Overview</span>
                <span>🌡️ 24°C</span>
                <span>⚡ ON</span>
            </div>
        </header>


        <!-- Living Room & Kitchen -->
        <div class="rooms">

            <!-- Living Room -->
            <section class="room">

                <h2>LIVING ROOM</h2>

                <div class="device" onclick="toggleDevice(this)">
                    <span class="icon">💡</span>
                    <span>Light</span>
                    <span class="status">ON</span>
                </div>

                <div class="device" onclick="toggleDevice(this)">
                    <span class="icon">📺</span>
                    <span>TV</span>
                    <span class="status">OFF</span>
                </div>

                <div class="device" onclick="toggleDevice(this)">
                    <span class="icon">❄️</span>
                    <span>AC</span>
                    <span class="status">ON</span>
                </div>

            </section>


            <!-- Kitchen -->
            <section class="room">

                <h2>KITCHEN</h2>

                <div class="device" onclick="toggleDevice(this)">
                    <span class="icon">💡</span>
                    <span>Light</span>
                    <span class="status">OFF</span>
                </div>

                <div class="device" onclick="toggleDevice(this)">
                    <span class="icon">🔥</span>
                    <span>Oven</span>
                    <span class="status">ON</span>
                </div>

                <div class="device" onclick="toggleDevice(this)">
                    <span class="icon">🧊</span>
                    <span>Fridge</span>
                    <span class="status">ON</span>
                </div>

            </section>

        </div>


        <!-- Security Zones -->
        <section class="security">

            <h2>SECURITY ZONES</h2>

            <div class="security-items">

                <div class="security-item">
                    <span>🔒</span>
                    <span>Front Door</span>
                </div>

                <div class="security-item">
                    <span>🔒</span>
                    <span>Garage</span>
                </div>

                <div class="security-item">
                    <span>🔒</span>
                    <span>Back Door</span>
                </div>

            </div>

        </section>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
